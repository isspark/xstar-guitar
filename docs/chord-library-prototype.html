<body>
<main class="app">
 <section class="page" id="library" aria-label="和弦库">
  <header><div class="brand"><b>✳</b> XSTAR<span class="eyebrow">YOUR POCKET GUITAR LAB</span></div><button class="round" id="menu" aria-label="打开导航菜单"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14M9 16h10"/></svg></button></header>
  <h1 class="title">和弦实验室<span style="color:var(--lime)">。</span></h1>
  <p class="intro">找到指法，听见每一种声音</p>
  <label class="search"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="6"/><path d="m15 15 5 5"/></svg><input id="search" type="search" placeholder="搜索和弦，如 C、Am、Cmaj7" aria-label="搜索和弦" autocomplete="off"><button class="clear" id="clear" aria-label="清空搜索" hidden>×</button></label>
  <div class="tabs" id="library-tabs" aria-label="和弦集合"><button class="tab active" data-mode="popular" aria-pressed="true">常用和弦</button><button class="tab" data-mode="all" aria-pressed="false">全部和弦</button><button class="tab" data-mode="favorites" aria-pressed="false">我的收藏 <span id="favorite-count">0</span></button></div>
  <div class="scroller" id="roots" aria-label="按根音筛选"></div><div class="scroller qualities" id="qualities" aria-label="按和弦类型筛选"></div>
  <div class="list-heading"><span id="result-title">从这些声音开始</span><small id="result-count"></small></div><div class="grid" id="grid"></div>
  <nav class="pagination" aria-label="和弦分页"><button id="prev-page" aria-label="上一页和弦">← 上一页</button><span id="page-label" aria-live="polite"></span><button id="next-page" aria-label="下一页和弦">下一页 →</button></nav>
  <p class="footnote">STANDARD TUNING · E A D G B E</p>
 </section>
 <section class="page" id="detail" aria-label="和弦详情" hidden>
  <header class="detail-header"><button class="round" id="back" aria-label="返回和弦库"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg></button><span class="eyebrow">CHORD EXPLORER<br><span style="display:block;margin-top:5px;letter-spacing:1px">和弦探索</span></span><button class="round" id="detail-star" aria-label="收藏和弦" aria-pressed="false">☆</button></header>
  <div class="detail-title"><div><h1 id="chord-name" tabindex="-1"></h1><p id="chord-description"></p></div><span class="tone-label" id="tone-label"></span></div>
  <div class="voicing-row"><h2>找到舒服的指法</h2><small id="voicing-count"></small></div><div class="scroller voicings" id="voicings" aria-label="切换指法"></div>
  <div class="board"><div class="board-top"><span id="position-label"></span><button class="hand-toggle" id="left-hand" aria-pressed="false">左手琴视图 ⇄</button></div><div id="diagram"></div><div class="legend"><span><b>○</b> 空弦</span><span>× 不弹</span><span><b>1–4</b> 手指编号</span></div><p class="board-hint">点编号看按法 · 点底部弦号听单音</p></div>
  <div class="finger-guide" id="finger-guide" aria-label="选择手指"></div><div class="instruction" id="instruction" aria-live="polite"></div>
  <div class="tabs learn-tabs" id="learn-tabs"><button class="tab active" data-learn="steps" aria-pressed="true">怎么按</button><button class="tab" data-learn="theory" aria-pressed="false">和弦组成</button><button class="tab" data-learn="tips" aria-pressed="false">小技巧</button></div><div class="learn-body" id="learn-body"></div>
  <div class="transport"><div class="right-hand" id="right-hand" aria-label="右手拨弦方式"><button class="pluck-mode active" data-pluck="down" aria-pressed="true">↓ 下扫</button><button class="pluck-mode" data-pluck="up" aria-pressed="false">↑ 上扫</button><button class="pluck-mode" data-pluck="pima" aria-pressed="false">P i m a 分解</button></div><p class="play-feedback" id="play-feedback" aria-live="polite">拨片／拇指 · 从低音弦扫向高音弦</p><button class="play" id="play"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 10 7-10 7z" fill="currentColor" stroke="none"/></svg><span>听听这个和弦</span><small id="play-mode-label">↓ 下扫试听</small></button></div>
 </section>
</main>

$('menu').onclick=()=>showSheet('你的口袋练习室',`<a class="nav-link current" href="chord-library-prototype.html">和弦实验室 <small>当前</small></a><a class="nav-link" href="tuner-prototype.html">调音器 <small>先让每根弦准备好 ↗</small></a><a class="nav-link" href="metronome-prototype.html">节拍器 <small>找到你的节奏 ↗</small></a><button class="nav-link" style="width:100%;text-align:left" id="show-help">读懂和弦图 <small>新手指南 →</small></button><p style="color:var(--muted);font-size:10px;margin-top:20px">XSTAR / MAKE A LITTLE MUSIC EVERY DAY</p>`);
$('sheet-content').onclick=e=>{if(e.target.closest('#show-help'))showSheet('一分钟读懂和弦图',`<h3>像面对琴颈一样看图</h3><p>默认左侧是最粗的 6 弦，右侧是最细的 1 弦。横线是品丝，左侧数字是实际品位。左手琴视图会镜像左右顺序。</p><h3>四个编号，对应四根手指</h3><p>1 食指 · 2 中指 · 3 无名指 · 4 小指。相同编号由横条连接，表示同一根手指横按多根弦。</p><h3>○ 弹空弦，× 不弹</h3><p>顶部 ○ 表示不按也要弹，× 表示不要弹。点底部弦号可以听单音，底部绿色按钮试听整个和弦。</p><h3>关于这个原型</h3><p>提供标准调弦下 120 个和弦、可移动 E / A 型指法及常用开放指法。试听为浏览器合成音，用于演示音高与交互。完整产品可继续扩展转位、更多把位与其他调弦。</p>`);};
$('close-sheet').onclick=()=>$('sheet').close();$('sheet').onclick=e=>{if(e.target===$('sheet')){const r=$('sheet').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$('sheet').close();}};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&current&&!$('sheet').open)closeChord();});document.addEventListener('visibilitychange',()=>{if(document.hidden)stopSound();});
// Native touch scrolling on phones; mouse dragging for desktop prototype previews.
document.querySelectorAll('.scroller').forEach(strip=>{
 let startX=0,startScroll=0,dragging=false,moved=false,pointer=null;
 strip.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse'||e.button!==0)return;pointer=e.pointerId;startX=e.clientX;startScroll=strip.scrollLeft;dragging=true;moved=false;});
 strip.addEventListener('pointermove',e=>{if(!dragging||e.pointerId!==pointer)return;const delta=e.clientX-startX;if(Math.abs(delta)>5){moved=true;strip.classList.add('dragging');if(!strip.hasPointerCapture(pointer))strip.setPointerCapture(pointer);}if(moved){strip.scrollLeft=startScroll-delta;e.preventDefault();}});
 const finish=()=>{dragging=false;strip.classList.remove('dragging');};
 strip.addEventListener('pointerup',finish);strip.addEventListener('pointercancel',finish);strip.addEventListener('lostpointercapture',finish);strip.addEventListener('pointerleave',()=>{if(!moved)finish();});
 strip.addEventListener('click',e=>{if(moved){e.preventDefault();e.stopImmediatePropagation();moved=false;}},true);
 strip.addEventListener('wheel',e=>{if(strip.scrollWidth<=strip.clientWidth)return;const delta=Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY;if(delta){const before=strip.scrollLeft;strip.scrollLeft+=delta;if(before!==strip.scrollLeft)e.preventDefault();}},{passive:false});
});
renderPluck();renderLibrary();
</script>
